<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCfreetime - Login</title>
    <link rel="stylesheet" href="../Styles/styles.css">
</head>
<body>
    <div class="video-background">
        <video autoplay muted loop id="background-video">
            <source src="../Assets/videos/fondo2.mp4" type="video/mp4">
            Tu navegador no soporta la etiqueta de video.
        </video>
    </div>

    <nav>
    <a href="../index.html">Home</a>
        <a href="../Autenticacion/login.html">Login</a>
        <a href="../Autenticacion/register.html">Registro</a>
        <a href="../Paginas/category1.html">Productos</a>
        <a href="../Paginas/category2.html">Componentes</a>
        <a href="../Paginas/category3.html">Periféricos</a>
        <img src="../Assets/images/Logo.png" alt="Logo de la tienda" id="logo">
        <a href="#" id="logout-link" title="Cerrar sesión">Logout 🛑</a>
    </nav>
    
    <h1>Login</h1>
    <form id="login-form" action="/login" method="post" onsubmit="return handleLogin(event);">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
        
        <button type="submit">Entrar</button>

        <p class="register-text">
            ¿No tenés cuenta? 
            <a href="../Autenticacion/register.html" class="register-link">Crear nueva cuenta</a>

        </p>
    </form>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            window.location.href = "../index.html";
             
        }
    </script>

    <script>
    const logoutLink = document.getElementById("logout-link");
    if (logoutLink) {  
        logoutLink.addEventListener("click", function(event) {
            event.preventDefault();
            const confirmLogout = confirm("¿Estás seguro que querés cerrar sesión?");
            if (confirmLogout) {
                window.location.href = "../Autenticacion/login.html";
            }
        });
    }
    </script>
</body>
</html>

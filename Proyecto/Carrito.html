<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="Styles/Carrito.css"> 
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="Autenticacion/login.html">Login</a>
        <a href="Autenticacion/register.html">Registro</a>
        <a href="Paginas/category1.html">Productos</a>
        <a href="Paginas/category2.html">Componentes</a>
        <a href="Paginas/category3.html">Periféricos</a>
        <img src="Assets/images/Logo.png" alt="Logo de la tienda" id="logo"> 
        <a href="#" id="logout-link">Logout 🛑</a>
    </nav>

    <div class="cart-container">
        <h1>Carrito de Compras</h1>
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="product-name">Ejemplo de prueba</td>
                    <td class="product-price">$0.00</td>
                    <td class="product-quantity">
                        <input type="number" value="1" min="1" class="quantity-input">
                        
                    </td>
                    <td class="product-total">$0.00</td>
                    <td class="product-actions">
                        <button class="remove-button">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="cart-summary">
            <h2>Total: <span id="cart-total">$0.00</span></h2>
            <button class="checkout-button">Finalizar Compra</button>

        </div>
    </div>

    <script>

        document.getElementById('logout-link').addEventListener('click', function(event) {
            event.preventDefault();
            if(confirm("¿Estás seguro de que quieres cerrar sesión?")) {
                window.location.href = "Autenticacion/login.html";

            }
        });
    </script>
</body>
</html>
